# Push changed-content URLs to IndexNow (the index behind Bing, ChatGPT Search
# and Copilot) on every push to main that touches content. Three steps:
#
#   derive  scripts/indexnow-urls.ts maps the pushed range to the URLs whose
#           content it changed, in every locale lib/translated-routes.ts serves
#           them in (its header documents the rules and their known limits;
#           its --self-test runs in CI)
#   wait    scripts/indexnow-wait-for-deploy.ts polls /deploy-sha.txt until
#           production serves this commit or a descendant. The old job pinged
#           within ~20s of the merge, while the Vercel build takes ~2 minutes,
#           so the crawler fetched the PREVIOUS deploy: a new URL 301'd or 404'd
#           and an edited page served its old copy
#   ping    scripts/indexnow-ping.ts
#
# Why a marker route and not `on: deployment_status`: for this repo the GitHub
# deployments API has reported Preview-only while real Production builds ran,
# so it cannot say when production changed. The marker is read from production.
#
# Nothing derived -> the job ends after `derive`, visibly and green, without
# calling the API (indexnow-ping.ts hard-fails on an empty list by design; the
# decision to skip lives HERE, not in a silent script no-op).
#
# A RED run, most often: `wait` timed out, because the deploy never went live
# (Vercel skipped the build, it is still queued past 20 minutes, or production
# was rolled back to an older commit), and NOTHING was pinged. For a content
# push that derives a URL this is the alarm for a silently skipped production
# build. Other causes, each named in the log: the derivation crashed, the list
# exceeded indexnow-ping.ts's MAX_URLS (nothing pinged), or the IndexNow API
# rejected a batch (earlier batches of 100 were already submitted). A later push
# diffs only its own range, so a failed run's URLs are covered by nothing but a
# "Re-run jobs" on that run once production has caught up; the rerun re-derives
# the same range, and the wait accepts a descendant deploy such as an empty
# redeploy commit.
name: IndexNow

on:
  push:
    branches: [main]
    # Must equal TRIGGER_PATHS in scripts/indexnow-urls.ts; its self-test
    # asserts the two lists match.
    paths:
      - 'data/**'
      - 'messages/**'
      - 'app/llms.txt/**'
      - 'app/llms-full.txt/**'

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    # Outer bound only; the deploy wait has its own, shorter timeout.
    timeout-minutes: 30
    # No `concurrency` group, deliberately: GitHub cancels a PENDING run when a
    # newer one queues behind it, which would drop that push's pings. Parallel
    # runs are safe because the wait accepts any descendant deploy.
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD^ is the fallback base below. The push's own base is fetched
          # on demand, and the wait fetches whatever commit production serves.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The derivation imports repo modules (the registry, the data files at
      # both revisions) and the pinned tsx; the version npx would fetch is not
      # the one CI tested.
      - run: npm ci

      - name: Resolve the pushed range
        id: range
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # The PUSH's range, not HEAD^..HEAD. A direct push of several commits
          # triggers when ANY of them touches the paths above, and HEAD^..HEAD
          # would then diff the last commit only, deriving nothing when the
          # content was in an earlier one. `git diff` needs just the two commit
          # objects, so depth 1 is enough for BEFORE.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && { git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
                  || git fetch --no-tags --quiet --depth=1 origin "$BEFORE"; }; then
            echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=IndexNow::push base '$BEFORE' is unavailable (force-push?); diffing HEAD^..HEAD only"
            echo "base=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive changed URLs
        id: derive
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: |
          npx tsx scripts/indexnow-urls.ts --base "$BASE" > urls.txt
          echo "urls to ping:"; cat urls.txt
          echo "count=$(grep -c . urls.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Wait for production to serve this commit
        if: steps.derive.outputs.count != '0'
        # 20 minutes: builds take ~2, and build concurrency is shared with the
        # team's other projects, so a queued build can start late.
        run: npx tsx scripts/indexnow-wait-for-deploy.ts --sha "$GITHUB_SHA" --timeout 1200

      - name: Ping IndexNow
        if: steps.derive.outputs.count != '0'
        run: |
          # One invocation with the URLs as argv, read from the file. Not xargs:
          # xargs may split a long list across several invocations, each passing
          # indexnow-ping.ts's MAX_URLS guard alone. And not a
          # `${{ steps.x.outputs.urls }}` expansion inside this script: a
          # newline-separated value pasted into the script made every URL after
          # the first run as its own command (exit 127), pinging one URL per push.
          mapfile -t URLS < urls.txt
          npx tsx scripts/indexnow-ping.ts "${URLS[@]}"
