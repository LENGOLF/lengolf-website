# Post-merge deploy check: did this push to main actually reach production?
#
# At least 20 merges to main since July (#81 ... #131) got no production
# build, and nothing alerted anyone: the merge commit's `Vercel` status goes
# red, but nobody watches a status on a commit that is already merged.
# Usually the squash commit's author is not a Vercel team member; once the
# integration itself was disconnected. #131 sat undeployed for 12 days and was
# found by an SEO check. This workflow makes that loud within 12 to 20
# minutes of the push.
#
#   wait-for-deploy  polls https://www.len.golf/deploy-sha.txt (the SHA baked
#                    in at build time, app/deploy-sha.txt/route.ts, #133) until
#                    production serves this commit or a DESCENDANT, via
#                    scripts/wait-for-deploy.ts. "Contains", not "equals": when
#                    a later build ships first, this commit is live inside it
#                    and must not be reported missing. On a miss: the job goes
#                    red and a `deploy-missing` issue is opened (or commented,
#                    on a re-run) and assigned, naming what Vercel said about
#                    the commit. A check that crashes opens one too. On
#                    success: every open `deploy-missing` issue whose commit is
#                    now live is closed.
#   indexnow         (was indexnow.yml, #133) derives the exact URLs a push
#                    changed, in every locale, and pings them only AFTER the
#                    deploy is live. The original job fired ~15s after the
#                    push, before any build existed: on #131 it pinged 19 EN
#                    URLs whose pages had not changed yet, and never the 36
#                    translated pages the merge created. It diffs from the build
#                    production served BEFORE this deploy (the poller's
#                    `diff_base`), so when a stranded commit ships inside a
#                    later push's build, that run pings its URLs too. It cannot
#                    see two cases, and says so: a fix that is not a push (a
#                    dashboard redeploy; the issue text covers it), and a later
#                    push whose runner starts after its build is already live
#                    (no `diff_base`; the close comment on the stranded
#                    commit's issue says its ping was not sent). "Re-run failed
#                    jobs" on the original run handles both.
#
# ONLY A RED `wait-for-deploy` JOB MEANS PRODUCTION IS MISSING A COMMIT. The
# `indexnow` job fails on its own when the IndexNow API rejects a ping, which
# also paints this workflow red; read the job name before acting.
#
# Why the live site and not an API: the GitHub deployments API records a
# Production deployment only once the build completes, so read mid-build it
# says "no deploy" (that misled a check on #97), and a Vercel status says
# what Vercel tried, not what production serves.
#
# Deploy hook (optional, dormant): if the repo secret VERCEL_DEPLOY_HOOK_URL
# exists, the poller POSTs it once: early when Vercel reports the author gate,
# otherwise at the deadline when Vercel reported nothing or a canceled build.
# Fired at the deadline, it waits one more window before failing; an early
# fire gets only the rest of the 12 minutes. Never on a real build failure
# and never while Vercel is building. WHETHER A DEPLOY HOOK GETS PAST THE
# AUTHOR GATE IS UNVERIFIED. To test it once before adding the secret: create
# the hook (Vercel > lengolf-website > Settings > Git > Deploy Hooks, branch
# `main`), and the next time a `deploy-missing` issue says `author-gate`, run
# `curl -X POST "<hook url>"` by hand and watch
# `vercel ls lengolf-website --scope david2928s-projects`. A new Production
# build that goes Ready means hooks work: add the secret, and the empty
# redeploy commit is no longer needed. If it does NOT work, delete the hook
# path from the poller and its contract cases rather than leaving it dormant.
#
# No `concurrency` group on purpose: cancel-in-progress would kill an earlier
# push's run, and with it that push's IndexNow ping.
name: Deploy check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  wait-for-deploy:
    # A manual run on another branch would wait for a commit production is
    # never meant to serve, and open an issue that can never close.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 12 min wait + 8 min grace (or post-hook window) + request slack. #133's
    # wait was a flat 20 minutes, because a build queued behind the team's
    # other projects can start late. Here the grace window covers that: a
    # queued build already posts a `pending` Vercel status, so only a push
    # Vercel never acknowledged at all fails at 12.
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: read
      issues: write
    outputs:
      live_sha: ${{ steps.wait.outputs.live_sha }}
      diff_base: ${{ steps.wait.outputs.diff_base }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for production to serve this commit
        id: wait
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        # No `npm ci` here (the poller imports only node builtins), so tsx comes
        # from npx: pinned to the lockfile's version rather than whatever is
        # latest, since it runs in a step holding GITHUB_TOKEN and the hook
        # secret. Its own dependencies (esbuild, get-tsconfig) still resolve
        # within tsx's ranges; `npm ci` would pin those too, at ~30s a run.
        run: npx --yes tsx@4.21.0 scripts/wait-for-deploy.ts

      - name: Open or update the deploy-missing issue
        # A miss (exit 1) and a check that could not run (exit 2, no verdict)
        # both open one: either way nobody knows the commit is live.
        if: failure() && steps.wait.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          VERDICT: ${{ steps.wait.outputs.verdict }}
          LIVE: ${{ steps.wait.outputs.live_sha }}
          VERCEL_STATE: ${{ steps.wait.outputs.vercel_state }}
          VERCEL_URL: ${{ steps.wait.outputs.vercel_target_url }}
          HOOK_FIRED: ${{ steps.wait.outputs.hook_fired }}
          ELAPSED: ${{ steps.wait.outputs.elapsed_sec }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT="${SHA:0:7}"
          # Commit text is untrusted input: it only ever reaches printf as an
          # ARGUMENT, never as part of a format string or a script. `<!--` is
          # broken up so a subject cannot forge the dedupe marker below. (Not
          # `&lt;`: bash 5.2, which ubuntu-latest ships, reads `&` in a
          # ${var//pat/rep} replacement as "the matched text".)
          AUTHOR=$(git log -1 --format='%an <%ae>' "$SHA")
          SUBJECT=$(git log -1 --format='%s' "$SHA")
          AUTHOR="${AUTHOR//<!--/< !--}"
          SUBJECT="${SUBJECT//<!--/< !--}"
          case "$VERCEL_STATE" in
            author-gate) WHY='Vercel blocked the build because the author of the commit is not a member of the Vercel team (the recurring squash-merge case). The Vercel status links to its team-members docs page, not to a deployment.' ;;
            canceled) WHY='The Vercel build for this commit was canceled (the status says so). Nothing is wrong with the code: redeploy.' ;;
            build-failed) WHY='Vercel started a build and it FAILED. Open the Vercel link below. Redeploying the same code will fail the same way, so fix the build first.' ;;
            building|built) WHY='Vercel reported a build in progress (or finished), but production never served it inside the window. Look for a stuck deployment in vercel ls; an Instant Rollback in Vercel (a rollback stops new builds being promoted until it is undone, and an empty commit will not help while it is active); or a preview promoted to production, whose branch commit main does not contain.' ;;
            *) WHY='Vercel posted no status on this commit at all, so it probably never saw the push. The GitHub integration may be disconnected: remove and re-add it in the Vercel dashboard, then deploy main from there.' ;;
          esac
          BODY="$RUNNER_TEMP/deploy-missing.md"
          if [ "$VERDICT" = missing ]; then
            TITLE="Production deploy missing for $SHORT"
            {
              printf 'Commit `%s` was pushed to `main`, and after %ss production (https://www.len.golf/deploy-sha.txt) still serves `%s`, which does not contain it.\n\n' "$SHA" "$ELAPSED" "${LIVE:-no commit SHA}"
              printf '> %s\n>\n> %s\n\n' "$SUBJECT" "$AUTHOR"
              printf '**Vercel status on the commit:** `%s` %s\n\n' "$VERCEL_STATE" "$VERCEL_URL"
              printf '%s\n\n' "$WHY"
              if [ -z "$LIVE" ]; then
                printf 'Production served no commit SHA at all. A production build made from the CLI (`vercel --prod`) carries no Git SHA, and neither does a build older than this check.\n\n'
              fi
            } > "$BODY"
          else
            TITLE="Deploy check could not run for $SHORT"
            {
              printf 'The deploy check exited without a verdict for commit `%s` (bad configuration, a crash, or tsx failing to install; see the run). Whether production serves this commit is UNKNOWN.\n\n' "$SHA"
              printf '> %s\n>\n> %s\n\n' "$SUBJECT" "$AUTHOR"
              printf 'Check by hand: `curl -s https://www.len.golf/deploy-sha.txt` should show `%s` or a later commit.\n\n' "$SHA"
            } > "$BODY"
          fi
          {
            printf 'Deploy hook fired: %s. Run: %s\n\n' "${HOOK_FIRED:-false}" "$RUN_URL"
            printf 'To redeploy (author gate, canceled, or no status), push an empty commit as a Vercel team member:\n\n'
            printf '    git commit --allow-empty -m "chore: redeploy main after %s" && git push origin main\n\n' "$SHORT"
            printf 'That push gets its own deploy-check run, which closes this issue once production contains `%s`.\n\n' "$SHORT"
            printf 'If you fix it WITHOUT a push (a redeploy from the Vercel dashboard, or a deploy hook fired by hand), use **Re-run failed jobs** on the run above once production has it. That closes this issue and sends the IndexNow ping this commit never got, which no later push will send for it.\n\n'
            printf '<!-- deploy-check sha=%s -->\n' "$SHA"
          } >> "$BODY"

          echo "::error title=$TITLE::Vercel: ${VERCEL_STATE:-unknown}. A deploy-missing issue has been opened or updated."

          gh label create deploy-missing --color B60205 \
            --description "A push to main that production never served (deploy-check.yml)" --force >/dev/null 2>&1 || true
          EXISTING=$(gh issue list --state open --label deploy-missing --limit 100 --json number,body \
            --jq ".[] | select(.body | contains(\"<!-- deploy-check sha=$SHA -->\")) | .number" 2>/dev/null | head -n1 || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY"
          else
            # Assigned so the owner gets an email; retried unassigned rather
            # than losing the issue if the assignment is ever rejected.
            gh issue create --title "$TITLE" --label deploy-missing --assignee david2928 --body-file "$BODY" \
              || gh issue create --title "$TITLE" --label deploy-missing --body-file "$BODY"
          fi

      - name: Close deploy-missing issues this build resolves
        if: success()
        # Housekeeping. A hiccup here must not turn a confirmed deploy red.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          LIVE: ${{ steps.wait.outputs.live_sha }}
          DIFF_BASE: ${{ steps.wait.outputs.diff_base }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # This run's IndexNow job diffs from DIFF_BASE, the build live before
          # this deploy. Empty means the first build this run observed was
          # already live, or was not an ancestor of this push, so the job falls
          # back to this push's own range and does not cover an earlier
          # stranded commit: say so on that commit's issue rather than closing
          # it as if nothing were left to do.
          NOTE=""
          if [ -z "$DIFF_BASE" ]; then
            NOTE=" This run could not diff from the build that was live before it (production was already serving this push, or a build main does not contain, on its first check), so its IndexNow job diffed only this push's range: that commit's URLs were NOT pinged. Use Re-run failed jobs on the run linked in this issue to send them."
          fi
          OPEN=$(gh issue list --state open --label deploy-missing --limit 100 --json number,body \
            --jq '.[] | "\(.number) \((.body | capture("<!-- deploy-check sha=(?<s>[0-9a-f]{40}) -->") | .s) // "")"' 2>/dev/null || true)
          if [ -z "$OPEN" ]; then echo "no open deploy-missing issues"; exit 0; fi
          # `</dev/null` on every gh call: they run inside a loop reading
          # $OPEN on stdin, and must not consume the remaining lines. A failed
          # close warns and moves on rather than stranding the issues after it.
          while read -r NUM ISSUE_SHA; do
            [ -n "$ISSUE_SHA" ] || continue
            REL=$(gh api "repos/$GITHUB_REPOSITORY/compare/$ISSUE_SHA...$LIVE" --jq .status </dev/null 2>/dev/null || echo unknown)
            if [ "$REL" = identical ] || [ "$REL" = ahead ]; then
              EXTRA=""
              if [ "$ISSUE_SHA" != "$SHA" ]; then EXTRA="$NOTE"; fi
              gh issue close "$NUM" --comment "Resolved: production now serves \`${LIVE:0:7}\`, which contains \`${ISSUE_SHA:0:7}\`. Checked by $RUN_URL.$EXTRA" </dev/null \
                || echo "::warning::could not close #$NUM"
            else
              echo "#$NUM ($ISSUE_SHA) is not in the live build ($REL); leaving it open"
            fi
          done <<< "$OPEN"

  # Push changed-content URLs to IndexNow (the index behind Bing, ChatGPT
  # Search and Copilot), once the content is actually live. This was
  # .github/workflows/indexnow.yml (#133), minus its own deploy wait: the
  # `needs: wait-for-deploy` below is that wait now.
  #
  #   derive  scripts/indexnow-urls.ts maps the diff range to the URLs whose
  #           content it changed, in every locale lib/translated-routes.ts
  #           serves them in (its header documents the rules and their known
  #           limits; its --self-test runs in CI and pins this job's wiring)
  #   ping    scripts/indexnow-ping.ts
  #
  # Runs on every push (the workflow has no `paths:` filter, which the
  # derivation's self-test pins: a filter narrower than its TRIGGER_PATHS
  # would silently skip pings). Nothing derived -> the job ends after
  # `derive`, visibly and green, without calling the API (indexnow-ping.ts
  # hard-fails on an empty list by design; the decision to skip lives HERE).
  #
  # A red run here means the derivation crashed, the list exceeded
  # indexnow-ping.ts's MAX_URLS (nothing pinged), or the IndexNow API
  # rejected a batch (earlier batches of 100 were already submitted). It does
  # NOT mean a missed deploy: that is a red `wait-for-deploy`, with this job
  # skipped. Either way, "Re-run failed jobs" on the run once fixed. That
  # reuses the wait job's saved diff_base, so if a wide diff_base is what
  # pushed the list past MAX_URLS, use "Re-run all jobs" instead: the wait
  # job re-polls, finds this push live, and the derivation falls back to the
  # push range.
  indexnow:
    needs: wait-for-deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD and HEAD^ (the last-resort base). Any other base is fetched
          # on its own below; the full history is ~150 MB.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The derivation imports repo modules (the registry, the data files at
      # both revisions) and the pinned tsx; the version npx would fetch is not
      # the one CI tested.
      - run: npm ci

      - name: Resolve the diff base
        id: range
        env:
          # The build production served before this deploy landed, when it was
          # an ancestor of this commit (empty otherwise). See the header.
          DIFF_BASE: ${{ needs.wait-for-deploy.outputs.diff_base }}
          BEFORE: ${{ github.event.before }}
        run: |
          # First choice: diff_base, so a commit stranded by a missed deploy is
          # pinged when this push's build finally ships it. Second: the PUSH's
          # range, not HEAD^..HEAD, because a direct push of several commits
          # would otherwise diff the last commit only. `git diff` needs just
          # the two commit objects, so depth 1 is enough for either.
          usable() {
            [ -n "$1" ] && [ "$1" != "0000000000000000000000000000000000000000" ] \
              && { git cat-file -e "$1^{commit}" 2>/dev/null \
                   || git fetch --no-tags --quiet --depth=1 origin "$1"; }
          }
          if [ -n "$DIFF_BASE" ] && ! usable "$DIFF_BASE"; then
            echo "::warning title=IndexNow::diff_base $DIFF_BASE could not be fetched; falling back to the push range, so a stranded commit's URLs may not be pinged"
          fi
          if usable "$DIFF_BASE"; then
            echo "base=$DIFF_BASE (the build live before this deploy)"
            echo "base=$DIFF_BASE" >> "$GITHUB_OUTPUT"
          elif usable "$BEFORE"; then
            echo "base=$BEFORE (the push range)"
            echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=IndexNow::no usable base (diff_base '$DIFF_BASE', push base '$BEFORE'); diffing HEAD^..HEAD only"
            echo "base=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive changed URLs
        id: derive
        env:
          BASE: ${{ steps.range.outputs.base }}
        run: |
          npx tsx scripts/indexnow-urls.ts --base "$BASE" > urls.txt
          echo "urls to ping:"; cat urls.txt
          echo "count=$(grep -c . urls.txt || true)" >> "$GITHUB_OUTPUT"

      - name: Ping IndexNow
        if: steps.derive.outputs.count != '0'
        run: |
          # One invocation with the URLs as argv, read from the file. Not xargs:
          # xargs may split a long list across several invocations, each passing
          # indexnow-ping.ts's MAX_URLS guard alone. And not a
          # `${{ steps.x.outputs.urls }}` expansion inside this script: a
          # newline-separated value pasted into the script made every URL after
          # the first run as its own command (exit 127), pinging one URL per push.
          mapfile -t URLS < urls.txt
          npx tsx scripts/indexnow-ping.ts "${URLS[@]}"
