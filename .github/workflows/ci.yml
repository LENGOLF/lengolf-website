name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Guards against wrong-prefix SEO cross-links (a FAQ slug linked as
      # /guide/… or vice-versa) shipping as live 404s. No server needed.
      - run: npm run validate:links
      # Automates the mechanical subset of the i18n native-QA rubric: emoji/！,
      # full-width digits, terminology `avoid` variants, brand-immutable casing,
      # markdown/placeholder integrity, per the data/i18n-glossary/*.json house
      # style. No server needed.
      - run: npm run validate:i18n
      # The detectors above are only as good as their proof that they still
      # fire. `--self-test` drives every ERROR check through the real functions
      # on synthetic inputs — including the rules whose deletion is otherwise
      # INVISIBLE to a corpus run, because a corpus that happens to be clean
      # looks identical to a corpus that is no longer being read. Two proven
      # regressions of exactly that shape: broadening the faq-hub filter regex
      # empties the whole ja/ko/zh/th corpus, and dropping the `{{token} }`
      # split-closer rule stops catching the raw token that ships to visitors.
      # Both leave `npm run validate:i18n` green, so this step is the gate.
      # It must stay a SEPARATE step: --self-test exits before the corpus
      # report, so it cannot replace the run above.
      - run: npm run validate:i18n:self-test
      # Green-fee plausibility: implausible fees (sub-฿600 weekday, weekend
      # cheaper than weekday, huge weekend jumps) fail unless the course file
      # carries a fees_verified_at attestation. Born from the Artitaya ฿400
      # incident — a scraped Thai-national rate shipping as the visitor rate.
      - run: npm run validate:courses
      - run: npm run validate:course-slots
      - run: npm run validate:fee-labels

      # Club spec-sheet parsers. rental_club_sets.variants[].spec is
      # staff-authored free text held only in production, and /golf-club-specs/
      # parses it into a table — so re-wording a spec in the DB can move a club
      # to the wrong row or blank a column, with nothing in git to catch it.
      # This pins the live strings plus every phrasing that has already broken
      # the classifier. Without this step the guard exists but never runs.
      - run: npm run validate:club-specs

      - name: pr-rigor disclosure
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run validate:pr-rigor

      # Hotel-concierge distances: the SAME distance to LENGOLF is stated in
      # hotel_distance_m (hero, walkability band, CTA) and in the
      # nearby_activities LENGOLF card. Nothing tied them together and they
      # disagreed on 9 of 12 entries, so one page printed two answers. Also
      # catches an implausible walking pace and any locale that changed a
      # number EN owns.
      - run: npm run validate:hotels

  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Asserts data/blog-translated-slugs.ts (the edge-middleware mirror of
      # blog_post_translations) matches the DB. Runs before the build so a
      # drifted mirror fails fast instead of shipping wrong redirects/404s.
      - name: Validate blog translated-slug mirror
        run: npm run validate:blog-slugs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Start server
        run: |
          npm run start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server ready after ~$((i*2))s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 60s"
              exit 1
            fi
            sleep 2
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run smoke tests
        run: npx tsx scripts/smoke-test.ts http://localhost:3000

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" || true

  # Mobile performance floor. See lighthouserc.js for the thresholds, the
  # measured baselines behind them, and why the homepage is not audited here
  # (its looping hero video makes Lighthouse return a score of 0 at random).
  #
  # This is deliberately a SEPARATE job rather than a few more steps on
  # build-and-smoke. build-and-smoke is a required check, and anything that can
  # flake must not sit in the required lane. `lighthouse` is intentionally left
  # OUT of branch protection to start with, so a red result is a loud, visible
  # signal on the PR without blocking a merge. Once it has a few weeks of green
  # history and the thresholds have been calibrated against real runner numbers
  # (download the lighthouse-reports artifact to read them), promote it to a
  # required check.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialized behind build-and-smoke rather than run in parallel. Both jobs
    # run `next build`, and app/[locale]/layout.tsx pulls FIVE font families
    # through next/font/google at build time. Run concurrently, the two jobs hit
    # fonts.googleapis.com from the same runner network simultaneously and one
    # gets throttled; the loader then reads null out of the response and the
    # build dies with "An error occurred in `next/font` — Cannot read properties
    # of null (reading '1')". Observed alternating between the two jobs on
    # consecutive runs of PR #93 (8d87d7e: lighthouse died; 5bb85ce:
    # build-and-smoke died, lighthouse passed on the SAME commit) — which is
    # what rules out a code defect.
    # `needs` also stops us burning a 4-minute Lighthouse run on a build that
    # already failed its smoke tests.
    needs: build-and-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Same curl-poll the smoke job uses, so both jobs fail the same way if the
      # production server cannot come up.
      - name: Start server
        run: |
          npm run start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server ready after ~$((i*2))s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 60s"
              exit 1
            fi
            sleep 2
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Pinned to an exact version and run through npx rather than added to
      # devDependencies on purpose: @lhci/cli pulls in roughly 850 packages that
      # only this job needs. Putting it in package.json would slow `npm ci` for
      # the lint and build-and-smoke jobs and every local `npm install` too.
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.js

      # Uploaded even when the assertions fail: the report is how you find out
      # WHICH metric regressed and by how much.
      #
      # include-hidden-files is required, not optional. `.lighthouseci` is a
      # dot-directory, and upload-artifact v4 skips hidden files by default, so
      # without this the step goes green while uploading nothing at all.
      # if-no-files-found: error makes that failure mode loud instead of a
      # warning nobody reads.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" || true
