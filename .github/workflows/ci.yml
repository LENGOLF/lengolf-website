name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Explicit, because the pr-rigor step calls `gh api .../pulls/<n>/files` to
    # derive its agent floor. On a repo whose default GITHUB_TOKEN is
    # contents-only that call fails, and the step's `|| true` would degrade
    # EVERY PR to the strict floor — safe, but the docs-only tier would then
    # silently never fire and nobody would know why. Naming both scopes makes
    # the dependency visible instead of inherited.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      # `next build` does not typecheck scripts/. tsconfig.scripts.json covers
      # exactly the validators above, so without this a broken gate ships as a
      # type error nobody sees until it runs.
      - run: npm run typecheck
      # Guards against wrong-prefix SEO cross-links (a FAQ slug linked as
      # /guide/… or vice-versa) shipping as live 404s. No server needed.
      - run: npm run validate:links
      # Automates the mechanical subset of the i18n native-QA rubric: emoji/！,
      # full-width digits, terminology `avoid` variants, brand-immutable casing,
      # markdown/placeholder integrity, per the data/i18n-glossary/*.json house
      # style. No server needed.
      - run: npm run validate:i18n
      # The detectors above are only as good as their proof that they still
      # fire. `--self-test` drives every ERROR check through the real functions
      # on synthetic inputs — including the rules whose deletion is otherwise
      # INVISIBLE to a corpus run, because a corpus that happens to be clean
      # looks identical to a corpus that is no longer being read. Two proven
      # regressions of exactly that shape: broadening the faq-hub filter regex
      # empties the whole ja/ko/zh/th corpus, and dropping the `{{token} }`
      # split-closer rule stops catching the raw token that ships to visitors.
      # Both leave `npm run validate:i18n` green, so this step is the gate.
      # It must stay a SEPARATE step: --self-test exits before the corpus
      # report, so it cannot replace the run above.
      - run: npm run validate:i18n:self-test
      # Green-fee plausibility: implausible fees (sub-฿600 weekday, weekend
      # cheaper than weekday, huge weekend jumps) fail unless the course file
      # carries a fees_verified_at attestation. Born from the Artitaya ฿400
      # incident — a scraped Thai-national rate shipping as the visitor rate.
      - run: npm run validate:courses
      # checkPackageNoun fires on ZERO lines in healthy data, so a green
      # corpus run proves nothing about it — and it is the only gate catching
      # a package course whose title calls its all-in rate a green fee.
      - run: npm run validate:courses:self-test
      - run: npm run validate:course-slots
      # ...and the same argument as validate:i18n:self-test above. The census
      # counts strings VISITED, not checks APPLIED, so disarming every script
      # detector prints a byte-identical "1708 strings · 0 problem(s) · OK".
      # This step is the only thing that can tell those two runs apart.
      - run: npm run validate:course-slots:self-test
      - run: npm run validate:fee-labels
      # ...and the same argument again. Every rule in that file self-disarmed
      # with byte-identical output, including the pre-existing basis rule — and
      # the noun rule fires on ZERO lines in healthy code, so nothing it prints
      # is evidence it works. This step is the only thing that can tell a
      # working gate from a disarmed one.
      - run: npm run validate:fee-labels:self-test

      # Club spec-sheet parsers. rental_club_sets.variants[].spec is
      # staff-authored free text held only in production, and /golf-club-specs/
      # parses it into a table — so re-wording a spec in the DB can move a club
      # to the wrong row or blank a column, with nothing in git to catch it.
      # This pins the live strings plus every phrasing that has already broken
      # the classifier. Without this step the guard exists but never runs.
      - run: npm run validate:club-specs

      # Metadata inheritance. Next merges page metadata per KEY, so a route
      # that declares its own `openGraph` REPLACES the layout's object rather
      # than extending it. All 30 page-level blocks had shipped with no
      # og:site_name, and the 13 that did not restate `type` themselves
      # shipped with no og:type either — the homepage among them, with lint,
      # typecheck and all 24 smoke sections green. tsc cannot see it (both
      # fields are optional), so this is the only static gate on it. It also
      # guards `twitter` and `icons`, which share the identical
      # wholesale-replacement hazard and are safe today only because no page
      # has written the offending line yet.
      - run: npm run validate:open-graph
      # A green corpus run proves the walk still parses and the declaration
      # count still matches — it does NOT prove the violation branches still
      # fire. Disarming only the bare-object rule leaves the corpus run green,
      # and this step is the only thing that tells those two apart. Same
      # argument as validate:i18n:self-test above.
      - run: npm run validate:open-graph:self-test
      # And this step is the only one that proves the gate EXITS non-zero.
      # Neither run above can: the corpus run exits 0 because the corpus is
      # good, and --self-test never calls main(), so dropping problems.length
      # from main()'s failure arithmetic printed every ERROR line and exited 0
      # with both of them green (measured). It also runs --self-test against a
      # deliberately mutated copy of the gate, which is the only check that
      # notices a harness reporting success it did not earn — a hardcoded
      # failure count, or a judge returning a fabricated passing verdict. Nine
      # corpus fixtures plus two self-test fixtures, one child process each.
      - run: npm run validate:open-graph:contract

      # The agent floor is TIERED, and the tier is derived from the PR's changed
      # paths — data the author cannot write into the body, which is the same
      # constraint the gate's docblock states for the count itself. A
      # documentation-only PR takes a floor of 1; everything else takes 3.
      #
      # PATHS, NOT SIZE. Measured over the last 40 merged PRs, a "<= 50 lines"
      # rule would have exempted #119 (43 lines / 4 files), whose review pass is
      # what caught rancho-charnvee being flagged in error, plus #101 (32) and
      # #103 (37), both subtle locale defects live on translated pages. Small
      # diff does not mean low risk here.
      #
      # `|| true` on the gh call is deliberate: an API hiccup must degrade to the
      # STRICT floor, not fail the step and not relax it. The gate cross-checks
      # this list against the payload's own changed_files count and falls back to
      # strict on any disagreement, so a truncated page cannot read as docs-only.
      #
      # `previous_filename` is emitted alongside `filename` because a RENAME is
      # reported as ONE entry naming only the DESTINATION. Without it,
      # `lib/course-fees.ts -> lib/course-fees.md` classified as docs-only while
      # deleting a build-critical module — confirmed by review, not theorised.
      # Emitting both names deliberately pushes the line count above
      # `changed_files`, so the gate's cross-check sends any PR containing a
      # rename to the strict floor. That is the intended outcome: renames are
      # rare, and "strict" is the right answer to an ambiguous one.
      - name: pr-rigor disclosure
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CHANGED_FILES_COUNT: ${{ github.event.pull_request.changed_files }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            PR_CHANGED_PATHS="$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' || true)"
            export PR_CHANGED_PATHS
          fi
          npm run validate:pr-rigor
      # The tier above is a decision, and a decision can be silently wrong in a
      # way the corpus run cannot show: a classifier stuck at "everything is
      # docs" relaxes every PR to 1 and still prints a healthy success line.
      # This drives isDocPath/resolveFloor through the real functions on
      # synthetic paths, pinning both directions.
      - run: npm run validate:pr-rigor:self-test
      # ...and this step is the only one that proves the gate's EXIT CODE is
      # right, which neither run above can. --self-test exits before the gate
      # body ever executes, so it covers the classifier and nothing downstream:
      # review measured `count < decision.floor` -> `count < DOCS_FLOOR`, and a
      # deleted process.exit(1) on the below-floor branch, BOTH leaving the two
      # steps above green while every PR in the repo relaxed to floor 1. Spawns
      # the real gate as a child process against 16 env fixtures, plus
      # --self-test against 5 deliberately disarmed copies with an unmutated
      # control. Same argument as validate:open-graph:contract.
      - run: npm run validate:pr-rigor:contract

      # Hotel-concierge distances: the SAME distance to LENGOLF is stated in
      # hotel_distance_m (hero, walkability band, CTA) and in the
      # nearby_activities LENGOLF card. Nothing tied them together and they
      # disagreed on 9 of 12 entries, so one page printed two answers. Also
      # catches an implausible walking pace and any locale that changed a
      # number EN owns.
      - run: npm run validate:hotels

  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Asserts data/blog-translated-slugs.ts (the edge-middleware mirror of
      # blog_post_translations) matches the DB. Runs before the build so a
      # drifted mirror fails fast instead of shipping wrong redirects/404s.
      - name: Validate blog translated-slug mirror
        run: npm run validate:blog-slugs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Start server
        run: |
          npm run start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server ready after ~$((i*2))s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 60s"
              exit 1
            fi
            sleep 2
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run smoke tests
        run: npx tsx scripts/smoke-test.ts http://localhost:3000

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" || true

  # Mobile performance floor. See lighthouserc.js for the thresholds, the
  # measured baselines behind them, and why the homepage is not audited here
  # (its looping hero video makes Lighthouse return a score of 0 at random).
  #
  # This is deliberately a SEPARATE job rather than a few more steps on
  # build-and-smoke. build-and-smoke is a required check, and anything that can
  # flake must not sit in the required lane. `lighthouse` is intentionally left
  # OUT of branch protection to start with, so a red result is a loud, visible
  # signal on the PR without blocking a merge. Once it has a few weeks of green
  # history and the thresholds have been calibrated against real runner numbers
  # (download the lighthouse-reports artifact to read them), promote it to a
  # required check.
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialized behind build-and-smoke rather than run in parallel. Both jobs
    # run `next build`, and app/[locale]/layout.tsx pulls FIVE font families
    # through next/font/google at build time. Run concurrently, the two jobs hit
    # fonts.googleapis.com from the same runner network simultaneously and one
    # gets throttled; the loader then reads null out of the response and the
    # build dies with "An error occurred in `next/font` — Cannot read properties
    # of null (reading '1')". Observed alternating between the two jobs on
    # consecutive runs of PR #93 (8d87d7e: lighthouse died; 5bb85ce:
    # build-and-smoke died, lighthouse passed on the SAME commit) — which is
    # what rules out a code defect.
    # `needs` also stops us burning a 4-minute Lighthouse run on a build that
    # already failed its smoke tests.
    needs: build-and-smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Same curl-poll the smoke job uses, so both jobs fail the same way if the
      # production server cannot come up.
      - name: Start server
        run: |
          npm run start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server ready after ~$((i*2))s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start within 60s"
              exit 1
            fi
            sleep 2
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Pinned to an exact version and run through npx rather than added to
      # devDependencies on purpose: @lhci/cli pulls in roughly 850 packages that
      # only this job needs. Putting it in package.json would slow `npm ci` for
      # the lint and build-and-smoke jobs and every local `npm install` too.
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.js

      # Uploaded even when the assertions fail: the report is how you find out
      # WHICH metric regressed and by how much.
      #
      # include-hidden-files is required, not optional. `.lighthouseci` is a
      # dot-directory, and upload-artifact v4 skips hidden files by default, so
      # without this the step goes green while uploading nothing at all.
      # if-no-files-found: error makes that failure mode loud instead of a
      # warning nobody reads.
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" || true
